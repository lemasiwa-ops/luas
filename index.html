<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064e3b">
  <title>myLUAS — Live tram arrivals</title>
  <style>
    :root {
      color-scheme: light;
      --green: #064e3b;
      --gold: #f2c75c;
      --ink: #15382c;
      --muted: #52665d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f7f2;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 36px 20px 52px;
      background: var(--green);
      color: white;
      border-bottom: 5px solid var(--gold);
    }

    .wrap { width: min(100%, 900px); margin: auto; }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 850;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    h1 span { color: var(--gold); }
    header p { margin: 14px 0 0; color: #d8eee3; }

    main {
      position: relative;
      margin: -28px auto 0;
      padding: 0 16px;
      max-width: 932px;
    }

    .panel, .direction {
      background: white;
      border: 1px solid #dce6dc;
      border-radius: 22px;
      box-shadow: 0 8px 28px #123d2910;
    }

    .panel { padding: 22px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 750;
    }

    select {
      width: 100%;
      min-height: 56px;
      padding: 12px;
      border: 2px solid #97afa0;
      border-radius: 12px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 1.1rem;
    }

    select:focus-visible, button:focus-visible {
      outline: 3px solid #b38612;
      outline-offset: 4px;
    }

    .controls, .buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls { justify-content: space-between; margin-top: 16px; }
    #updated { color: var(--muted); font-size: 0.9rem; }

    button {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.65; cursor: wait; }
    #nearest { background: var(--gold); color: var(--ink); }

    #locationInfo {
      margin: 18px 0 0;
      padding: 14px;
      border-radius: 12px;
      background: #e8f4eb;
    }

    .error {
      margin: 16px 0 0;
      padding: 14px 18px;
      border: 1px solid #e4a594;
      border-radius: 14px;
      background: #fff0eb;
      color: #842d1b;
      overflow-wrap: anywhere;
    }

    .error p { margin: 4px 0; }
    [hidden] { display: none !important; }

    .service {
      margin: 22px 0;
      padding: 16px 18px;
      border-left: 5px solid #b78b20;
      border-radius: 0 14px 14px 0;
      background: #fff6da;
    }

    .service strong {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #message { margin: 5px 0 0; white-space: pre-line; }
    h2 { margin: 26px 0 14px; font-size: 1.5rem; }
    .directions { display: grid; gap: 18px; }
    .direction { overflow: hidden; }

    .direction h3 {
      margin: 0;
      padding: 18px 20px;
      background: #dff3e8;
      font-size: 1.1rem;
    }

    .trams { margin: 0; padding: 0; list-style: none; }

    .tram {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-top: 1px solid #edf1ea;
    }

    .destination { font-size: 1.05rem; font-weight: 650; }

    .arrival {
      flex-shrink: 0;
      text-align: right;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }

    .number {
      display: block;
      font-size: 2.8rem;
      font-weight: 850;
      letter-spacing: -0.06em;
      line-height: 1.1;
    }

    .unit { display: block; color: var(--muted); font-size: 0.78rem; }
    .empty { margin: 0; padding: 22px 20px; color: var(--muted); }

    footer {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (min-width: 700px) {
      .directions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { padding-top: 48px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>my<span>LUAS</span></h1>
      <p>Your stop. Your next tram.</p>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Choose your stop">
      <label for="stop">Where are you travelling from?</label>
      <select id="stop">
        <option value="MYS">MYS — loading stops…</option>
      </select>

      <div class="controls">
        <div class="buttons">
          <button id="nearest" type="button">⌖ Nearest stop</button>
          <button id="refresh" type="button">Refresh now</button>
        </div>
        <span id="updated" role="status">Last updated: waiting for live data</span>
      </div>

      <p id="locationInfo" role="status" hidden></p>
    </section>

    <div id="errors" class="error" role="alert" hidden></div>

    <section class="service" aria-label="Service message">
      <strong>Service update</strong>
      <p id="message">Checking the service…</p>
    </section>

    <h2 id="stopName">Live arrivals</h2>
    <div id="directions" class="directions" aria-label="Live tram arrivals">
      <p class="empty">Loading your next trams…</p>
    </div>
  </main>

  <footer>
    Data: Transport Infrastructure Ireland. Built by Lynett Masiwa for BDAIB.
    <br>Live arrivals refresh every 20 seconds.
  </footer>

  <script>
    "use strict";

    const API = "https://luas-class.kluxy.app";
    const STORAGE_KEY = "myLUAS.stop";
    const $ = id => document.getElementById(id);

    const stopSelect = $("stop");
    const nearestButton = $("nearest");
    const refreshButton = $("refresh");
    const locationInfo = $("locationInfo");
    const errors = new Map();

    let stops = [];
    let stopsPromise = null;
    let selectedStop = "MYS";
    let refreshing = false;
    let locating = false;
    let selectionVersion = 0;
    let forecastVersion = 0;
    let forecastController = null;

    function setError(key, text) {
      if (text) errors.set(key, text);
      else errors.delete(key);

      $("errors").replaceChildren();

      for (const value of errors.values()) {
        const paragraph = document.createElement("p");
        paragraph.textContent = value;
        $("errors").append(paragraph);
      }

      $("errors").hidden = errors.size === 0;
    }

    function errorText(error) {
      return error instanceof Error ? error.message : String(error);
    }

    async function fetchJSON(url, controller = new AbortController()) {
      let timedOut = false;
      const timeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 12000);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: ${response.statusText || "Request failed"}`
          );
        }

        return await response.json();
      } catch (error) {
        if (timedOut) throw new Error("The request timed out. Please try again.");
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    try {
      selectedStop = localStorage.getItem(STORAGE_KEY) || "MYS";
    } catch (error) {
      setError("storage", `Cannot remember your stop: ${errorText(error)}`);
    }

    stopSelect.options[0].value = selectedStop;
    stopSelect.options[0].textContent = `${selectedStop} — loading stops…`;

    function saveStop() {
      try {
        localStorage.setItem(STORAGE_KEY, selectedStop);
        setError("storage", null);
      } catch (error) {
        setError("storage", `Cannot remember your stop: ${errorText(error)}`);
      }
    }

    // Shared request: refresh and location lookup can both request the stop list.
    async function loadStops() {
      if (stops.length) return stops;
      if (stopsPromise) return stopsPromise;

      stopsPromise = (async () => {
        const data = await fetchJSON(`${API}/stops`);

        if (!data || !Array.isArray(data.stops) || !data.stops.length) {
          throw new Error("The stop list is missing or empty.");
        }

        const parsed = data.stops.map(stop => {
          if (
            !stop || typeof stop.id !== "string" || !stop.id ||
            typeof stop.name !== "string" ||
            !["red", "green"].includes(stop.line)
          ) {
            throw new Error("The stop list contains invalid stop information.");
          }

          const validCoordinate = value =>
            (typeof value === "number" || typeof value === "string") &&
            String(value).trim() !== "" &&
            Number.isFinite(Number(value));

          if (
            !validCoordinate(stop.lat) || !validCoordinate(stop.lng) ||
            Math.abs(Number(stop.lat)) > 90 ||
            Math.abs(Number(stop.lng)) > 180
          ) {
            throw new Error(`Invalid coordinates for ${stop.name}.`);
          }

          return { ...stop, lat: Number(stop.lat), lng: Number(stop.lng) };
        });

        let nextSelection = selectedStop;
        if (!parsed.some(stop => stop.id === nextSelection)) {
          nextSelection = "MYS";
        }

        if (!parsed.some(stop => stop.id === nextSelection)) {
          throw new Error("The default stop MYS was not found.");
        }

        const fragment = document.createDocumentFragment();

        for (const line of ["red", "green"]) {
          const group = document.createElement("optgroup");
          group.label = line === "red" ? "Red Line" : "Green Line";

          parsed
            .filter(stop => stop.line === line)
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(stop => {
              const option = document.createElement("option");
              option.value = stop.id;
              option.textContent = stop.name;
              group.append(option);
            });

          fragment.append(group);
        }

        stops = parsed;
        selectedStop = nextSelection;
        stopSelect.replaceChildren(fragment);
        stopSelect.value = selectedStop;
        setError("stops", null);
        return stops;
      })();

      try {
        return await stopsPromise;
      } catch (error) {
        setError("stops", `Could not load stops: ${errorText(error)}`);
        throw error;
      } finally {
        stopsPromise = null;
      }
    }

    function placeholder(text) {
      const paragraph = document.createElement("p");
      paragraph.className = "empty";
      paragraph.textContent = text;
      $("directions").replaceChildren(paragraph);
    }

    function validateForecast(data) {
      if (
        !data || typeof data.stopName !== "string" ||
        !Array.isArray(data.directions) ||
        (data.message != null && typeof data.message !== "string")
      ) {
        throw new Error("The arrivals response has an unexpected format.");
      }

      for (const direction of data.directions) {
        if (
          !direction || typeof direction.name !== "string" ||
          !Array.isArray(direction.trams)
        ) {
          throw new Error("Invalid direction information.");
        }

        for (const tram of direction.trams) {
          if (
            !tram || typeof tram.destination !== "string" ||
            !["number", "string"].includes(typeof tram.due) ||
            String(tram.due).trim() === "" ||
            !Number.isFinite(Number(tram.due)) || Number(tram.due) < 0
          ) {
            throw new Error("Invalid tram arrival information.");
          }
        }
      }
    }

    function renderForecast(data) {
      $("stopName").textContent = data.stopName;
      $("message").textContent = data.message?.trim() || "No service message provided.";
      $("directions").replaceChildren();

      if (!data.directions.length) {
        placeholder("No direction or tram information is currently available.");
        return;
      }

      for (const direction of data.directions) {
        const card = document.createElement("section");
        card.className = "direction";

        const heading = document.createElement("h3");
        heading.textContent = direction.name;
        card.append(heading);

        const trams = [...direction.trams]
          .sort((a, b) => Number(a.due) - Number(b.due))
          .slice(0, 3);

        if (!trams.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No trams currently forecast in this direction.";
          card.append(empty);
        } else {
          const list = document.createElement("ul");
          list.className = "trams";

          for (const tram of trams) {
            const due = Number(tram.due);
            const row = document.createElement("li");
            row.className = "tram";

            const destination = document.createElement("span");
            destination.className = "destination";
            destination.textContent = tram.destination;

            const arrival = document.createElement("span");
            arrival.className = "arrival";

            const number = document.createElement("span");
            number.className = "number";
            number.textContent = due === 0 ? "Due" : String(due);

            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = due === 0 ? "now" : due === 1 ? "minute" : "minutes";

            arrival.append(number, unit);
            row.append(destination, arrival);
            list.append(row);
          }

          card.append(list);
        }

        $("directions").append(card);
      }
    }

    async function loadForecast() {
      if (forecastController) forecastController.abort();

      const controller = new AbortController();
      forecastController = controller;
      const version = ++forecastVersion;

      try {
        const data = await fetchJSON(
          `${API}/forecast?stop=${encodeURIComponent(selectedStop)}`,
          controller
        );

        if (version !== forecastVersion) return;

        validateForecast(data);
        renderForecast(data);
        setError("forecast", null);

        $("updated").textContent =
          `Last updated: ${new Date().toLocaleTimeString("en-IE", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          })}`;
      } catch (error) {
        if (version !== forecastVersion) return;

        setError("forecast", `Could not load live trams: ${errorText(error)}`);
        placeholder("Live arrivals are unavailable. Retrying automatically.");
        $("message").textContent = "Service message currently unavailable.";
        $("updated").textContent = "Last updated: unavailable — refresh failed";
      } finally {
        if (version === forecastVersion) forecastController = null;
      }
    }

    function selectStop(id, clearLocation = true) {
      selectionVersion++;
      selectedStop = id;
      stopSelect.value = id;
      saveStop();

      if (clearLocation) {
        locationInfo.hidden = true;
        locationInfo.textContent = "";
      }

      $("stopName").textContent =
        stopSelect.selectedOptions[0]?.textContent || id;
      $("updated").textContent = "Last updated: waiting for this stop";
      $("message").textContent = "Checking the service…";
      placeholder("Loading your next trams…");
      void loadForecast();
    }

    // Great-circle distance in kilometres using the haversine formula.
    function haversine(lat1, lng1, lat2, lng2) {
      const radians = degrees => degrees * Math.PI / 180;
      const deltaLat = radians(lat2 - lat1);
      const deltaLng = radians(lng2 - lng1);

      const a =
        Math.sin(deltaLat / 2) ** 2 +
        Math.cos(radians(lat1)) *
        Math.cos(radians(lat2)) *
        Math.sin(deltaLng / 2) ** 2;

      return 6371 * 2 * Math.atan2(
        Math.sqrt(Math.max(0, Math.min(1, a))),
        Math.sqrt(Math.max(0, 1 - a))
      );
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      });
    }

    function locationError(error) {
      switch (error.code) {
        case 1:
          return "Location permission was denied. Allow location access in your browser settings and try again.";
        case 2:
          return "Your location is unavailable. Check your device's location settings and try again.";
        case 3:
          return "Finding your location timed out. Please try again.";
        default:
          return errorText(error);
      }
    }

    async function findNearestStop() {
      if (locating) return;

      setError("location", null);
      locationInfo.hidden = true;

      if (!window.isSecureContext) {
        setError("location", "Location access requires HTTPS or localhost.");
        return;
      }

      if (!navigator.geolocation) {
        setError("location", "This browser does not support geolocation.");
        return;
      }

      locating = true;
      nearestButton.disabled = true;
      nearestButton.textContent = "Finding you…";

      // A later manual stop selection takes precedence over this lookup.
      const startingSelection = selectionVersion;

      try {
        // Request location directly from the user's button click.
        const [position, allStops] = await Promise.all([
          getPosition(),
          loadStops()
        ]);

        if (startingSelection !== selectionVersion) return;

        const { latitude, longitude, accuracy } = position.coords;
        let closest = null;
        let closestDistance = Infinity;

        for (const stop of allStops) {
          const distance = haversine(
            latitude, longitude, stop.lat, stop.lng
          );

          if (distance < closestDistance) {
            closest = stop;
            closestDistance = distance;
          }
        }

        if (!closest) throw new Error("No stops are available.");

        const distanceText = closestDistance < 1
          ? `${Math.round(closestDistance * 1000)} m`
          : `${closestDistance.toLocaleString("en-IE", {
              maximumFractionDigits: 1
            })} km`;

        const walkingMinutes = Math.ceil((closestDistance / 5) * 60);
        const walkingText = walkingMinutes === 0
          ? "less than 1 minute"
          : `${walkingMinutes} ${walkingMinutes === 1 ? "minute" : "minutes"}`;

        selectStop(closest.id, false);

        locationInfo.textContent =
          `${closest.name} is your nearest stop: ${distanceText} away. ` +
          `Estimated walk: ${walkingText} at 5 km/h. ` +
          `Based on straight-line distance; the walking route may be longer.` +
          (Number.isFinite(accuracy)
            ? ` Location accuracy: approximately ${Math.round(accuracy)} m.`
            : "");

        locationInfo.hidden = false;
      } catch (error) {
        if (startingSelection === selectionVersion) {
          setError("location", `Could not find your nearest stop: ${locationError(error)}`);
        }
      } finally {
        locating = false;
        nearestButton.disabled = false;
        nearestButton.textContent = "⌖ Nearest stop";
      }
    }

    async function refresh() {
      if (refreshing) return;

      refreshing = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "Refreshing…";

      try {
        if (!stops.length) {
          try {
            await loadStops();
          } catch {
            // The stop-list error is visible; still try the selected forecast.
          }
        }

        await loadForecast();
      } finally {
        refreshing = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "Refresh now";
      }
    }

    stopSelect.addEventListener("change", () => {
      setError("location", null);
      selectStop(stopSelect.value);
    });

    nearestButton.addEventListener("click", findNearestStop);
    refreshButton.addEventListener("click", refresh);
    window.addEventListener("online", refresh);

    void refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
